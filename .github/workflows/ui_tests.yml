name: Run UI tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test apks
        run: ./gradlew :app-lite:assembleDebugAndroidTest :data:database:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            adb logcat -c;
            ./gradlew :app-lite:connectedDebugAndroidTest :data:database:connectedDebugAndroidTest;
            status=$?;
            adb logcat -d > logcat.txt;
            grep -E "TestRunner|LeakCanary|AndroidRuntime" logcat.txt | tail -300;
            if grep -q "Crash of app" logcat.txt; then echo "App crashed during instrumented tests"; status=1; fi;
            exit $status

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            app-lite/build/reports/androidTests/
            data/database/build/reports/androidTests/
            logcat.txt

  monkey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app
        run: ./gradlew :app-lite:assembleDebug

      - name: Run monkey for 1 minute
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            ./gradlew :app-lite:installDebug;
            adb logcat -c;
            timeout 60 adb shell monkey -p com.bz.movies --pct-syskeys 0 --throttle 50 -v 1000000 > monkey.txt 2>&1;
            adb logcat -d > monkey-logcat.txt;
            tail -50 monkey.txt;
            if grep -qE "// CRASH|// NOT RESPONDING" monkey.txt; then grep -A40 -E "// CRASH|// NOT RESPONDING" monkey.txt; exit 1; fi

      - name: Upload monkey logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-logs
          path: |
            monkey.txt
            monkey-logcat.txt
